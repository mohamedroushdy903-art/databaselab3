{% extends 'base.html' %}

{% block title %}Create Account - AuthGuard{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="auth-card glassmorphism">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>Create an Account</h2>
            <p>Join AuthGuard to manage your profile securely</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="auth-form" id="registerForm" onsubmit="return validateRegistrationForm()">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="full_name" name="full_name" class="form-control" placeholder="John Doe" value="{{ full_name or '' }}" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required oninput="checkPasswordMatch(); updatePasswordStrength();">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <small class="form-hint" id="strengthText">Password must be at least 6 characters</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-cat input-icon"></i>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required oninput="checkPasswordMatch()">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm_password', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <small class="form-hint match-hint" id="matchHint"></small>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
